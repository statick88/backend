services:
  backend:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backend-check:
    profiles:
      - ci
    build:
      context: .
      target: check
